stages:
  - test
  - build
  - deploy

variables:
  DEPLOY_PATH: "/opt/real-estate/frontend"

default:
  tags:
    - rocky-frontend
  interruptible: true

test:
  stage: test
  script:
    - node -v
    - npm -v
    - printf "%s" "$ENV_FRONT_PROD" > .env.production
    - npm ci
    - npm run build
  only:
    - develop
    - main

build:
  stage: build
  script:
    - printf "%s" "$ENV_FRONT_PROD" > .env.production
    - docker build -t real-estate-frontend:ci-check .
    - docker image rm real-estate-frontend:ci-check || true
  only:
    - develop
    - main

deploy:
  stage: deploy
  script:
    - mkdir -p "$DEPLOY_PATH"
    - rsync -av --delete --exclude '.git' --exclude '.gitlab-ci.yml' ./ "$DEPLOY_PATH"/
    - cd "$DEPLOY_PATH"
    - printf "%s" "$ENV_FRONT_PROD" > .env.production
    - docker compose -f docker-compose.prod.yml up -d --build
    - docker compose -f docker-compose.prod.yml ps
    - docker image prune -f || true
  only:
    - main