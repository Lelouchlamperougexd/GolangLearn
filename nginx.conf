server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend (mirrors vite dev proxy)
    location /api/ {
        proxy_pass http://134.209.84.250:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket chat connections to backend
    location /ws/ {
        proxy_pass http://134.209.84.250:8080/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        proxy_pass http://134.209.84.250:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy BIN/IIN verification requests to the public legal-entity registry
    location /bin-registry/ {
        proxy_pass https://apiba.prgapp.kz/;
        proxy_ssl_server_name on;
        proxy_set_header Host apiba.prgapp.kz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
