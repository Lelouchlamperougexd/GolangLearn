name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - frontend-from-server
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_DEPLOY_HOST: 134.209.84.250
  DEFAULT_DEPLOY_USER: root
  DEFAULT_DEPLOY_PORT: 22
  DEFAULT_DEPLOY_PATH: /opt/real-estate/frontend

jobs:
  ci:
    name: Build and Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create production env file
        env:
          ENV_FRONT_PROD: ${{ secrets.ENV_FRONT_PROD }}
        run: |
          if [ -n "$ENV_FRONT_PROD" ]; then
            printf "%s" "$ENV_FRONT_PROD" > .env.production
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Docker build check
        run: docker build -t real-estate-frontend:ci-check .

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/frontend-from-server'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production env file
        env:
          ENV_FRONT_PROD: ${{ secrets.ENV_FRONT_PROD }}
        run: |
          if [ -n "$ENV_FRONT_PROD" ]; then
            printf "%s" "$ENV_FRONT_PROD" > .env.production
          fi

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-$DEFAULT_DEPLOY_HOST}"
          DEPLOY_PORT="${DEPLOY_PORT:-$DEFAULT_DEPLOY_PORT}"

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is not configured"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s" "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-$DEFAULT_DEPLOY_HOST}"
          DEPLOY_USER="${DEPLOY_USER:-$DEFAULT_DEPLOY_USER}"
          DEPLOY_PORT="${DEPLOY_PORT:-$DEFAULT_DEPLOY_PORT}"
          DEPLOY_PATH="${DEPLOY_PATH:-$DEFAULT_DEPLOY_PATH}"

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.*.local' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild and restart frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-$DEFAULT_DEPLOY_HOST}"
          DEPLOY_USER="${DEPLOY_USER:-$DEFAULT_DEPLOY_USER}"
          DEPLOY_PORT="${DEPLOY_PORT:-$DEFAULT_DEPLOY_PORT}"
          DEPLOY_PATH="${DEPLOY_PATH:-$DEFAULT_DEPLOY_PATH}"

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            cd '$DEPLOY_PATH' &&
            docker compose -f docker-compose.prod.yml up -d --build &&
            docker compose -f docker-compose.prod.yml ps &&
            docker image prune -f
          "
